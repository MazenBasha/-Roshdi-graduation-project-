name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (server only)
        run: |
          pip install --upgrade pip
          pip install fastapi 'uvicorn[standard]' pydantic-settings prometheus-client \
                      python-multipart pillow pytest httpx pyflakes
      - name: Lint
        run: pyflakes server tests
      - name: Tests (no model — OFFLINE skips model-loading tests)
        env:
          OFFLINE: "1"
        run: pytest -q --deselect tests/test_inference.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t roshdi/object-detection:ci .

services:
  od:
    build: .
    image: roshdi/object-detection:latest
    container_name: roshdi-od
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Pretrained weights are baked into the image — override only to ship a
      # custom fine-tune via the volume below.
      ROSHDI_OD_WEIGHTS_PATH: /app/weights/yolo11n.pt
      ROSHDI_OD_LOG_LEVEL: INFO
      ROSHDI_OD_METRICS_ENABLED: "true"
      ROSHDI_OD_API_KEY: ${ROSHDI_OD_API_KEY:-}
    # Mount a host directory ONLY if you want to override the baked-in
    # pretrained weights with a custom checkpoint. Comment out for the default
    # pretrained deployment.
    # volumes:
    #   - ./weights:/app/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  prometheus:
    image: prom/prometheus:latest
    container_name: roshdi-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - od

[project]
name = "roshdi-object-detection"
version = "0.1.0"
description = "YOLO11n fine-tune + inference service for the Roshdi assistive app"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "model: tests that require trained YOLO weights",
    "slow: tests that take more than ~5s",
]

[tool.pyflakes]
exclude = ["runs/*", "datasets/*"]
